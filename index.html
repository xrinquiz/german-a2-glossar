<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="German Glossar" />
    <meta name="application-name" content="German Glossar" />
    <meta name="theme-color" content="#dc2626" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Prevent chrome extension conflicts where extension scripts try to assign window.fetch
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress unhandled errors originating from chrome extensions
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('fetch of #<Window>') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>German A2 Glossar - Deutsch Vokabeln & Bangla</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('german_glossar_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Comprehensive German A2 vocabulary learning platform based on the official A2 Glossar with German audio pronunciation, Bengali & English meanings, natural example sentences, and interactive flashcards." />

    <meta property="og:description" content="Comprehensive German A2 vocabulary learning platform based on the official A2 Glossar with German audio pronunciation, Bengali & English meanings, natural example sentences, and interactive flashcards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
